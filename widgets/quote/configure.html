<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar: Frases</title>
    <link rel="stylesheet" href="../../shared/theme.css">
</head>
<body>
    <div class="page">
        <div class="page-header">
            <a class="back-link" href="../../index.html">← Volver</a>
            <h1>Configurar Frases</h1>
        </div>
        <div class="layout">
            <form id="config-form" class="config-form"></form>
            <div class="preview-wrap">
                <iframe id="preview" class="preview-frame"></iframe>
            </div>
        </div>
        <div class="url-box">
            <input id="url-output" type="text" readonly>
            <button id="copy-btn" type="button">Copiar URL</button>
            <button id="download-btn" type="button">Descargar imagen</button>
        </div>
        <p id="download-status" class="download-status" role="status"></p>
    </div>

    <script type="module">
        import schema from './schema.js';
        import { renderConfigurator } from '../../shared/configurator.js';
        import { fitPreview } from './preview-fit.js';
        import { setupDownload } from './download.js';

        renderConfigurator({
            schema,
            widgetUrl: './widget.html',
            formEl: document.getElementById('config-form'),
            previewEl: document.getElementById('preview'),
            urlOutputEl: document.getElementById('url-output'),
            copyBtnEl: document.getElementById('copy-btn')
        });

        // Solo en esta ventana de configuración (el widget final no tiene descarga)
        fitPreview(document.getElementById('preview'), document.querySelector('.preview-wrap'));
        setupDownload({
            buttonEl: document.getElementById('download-btn'),
            urlOutputEl: document.getElementById('url-output'),
            statusEl: document.getElementById('download-status')
        });
    </script>
</body>
</html>
