<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Calendario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            background: transparent !important;
            background-color: transparent !important;
        }
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        :root {
            --bg: #262626;
            --text: #d9d9d9;
            --accent: #ffffff;
            --today-text: #171717;
            --radius: 16px;
        }
        .calendar-card {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 4 / 3;
            background: var(--bg);
            color: var(--text);
            border-radius: var(--radius);
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .month-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .month-nav {
            display: none;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 16px;
            opacity: 0.7;
            cursor: pointer;
            padding: 0;
        }
        .month-nav:hover {
            opacity: 1;
        }
        .month-label {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }
        .day-headers,
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .day-headers {
            margin-bottom: 6px;
        }
        .day-label {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.55;
        }
        .days-grid {
            flex: 1;
            min-height: 0;
            row-gap: 2px;
        }
        .day-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .day-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
        }
        .day-number.today {
            background: var(--accent);
            color: var(--today-text);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="calendar-card">
        <div class="month-header">
            <button class="month-nav" id="prev-month" aria-label="Mes anterior">‹</button>
            <div class="month-label" id="month-label"></div>
            <button class="month-nav" id="next-month" aria-label="Mes siguiente">›</button>
        </div>
        <div class="day-headers" id="day-headers"></div>
        <div class="days-grid" id="days-grid"></div>
    </div>
    <script type="module" src="./widget.js"></script>
</body>
</html>
